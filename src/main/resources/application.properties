spring.application.name=resume-ai
server.port=8080

# ----------------------------------------------------------------------------
# AI provider configuration (OpenAI-compatible Chat Completions API).
# Works with OpenAI, Mistral, Groq, Together, or a local Ollama server.
#
# Leave ai.api.key EMPTY to run the app in offline "template mode" -- the
# generator still produces a full resume/cover letter from your input using
# built-in templates, so the project runs end-to-end without any API key.
#
# To enable real AI generation, set the three values below (env vars shown).
# ----------------------------------------------------------------------------
ai.api.base-url=${AI_API_BASE_URL:https://api.openai.com/v1}
ai.api.key=${AI_API_KEY:}
ai.api.model=${AI_API_MODEL:gpt-4o-mini}
ai.api.timeout-seconds=${AI_API_TIMEOUT:60}

# File upload limits (resume analysis accepts PDF/TXT)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Allowed origin for the React dev server (Vite)
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}

# ----------------------------------------------------------------------------
# NEW: Accounts database (registration / login / profile).
# File-based H2 -> data survives restarts, zero setup required.
# To use postgress instead, just replace these 4 lines (no code changes needed):
#   spring.datasource.url=jdbc:mysql://localhost:3306/resumeai
#   spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#   spring.datasource.username=root
#   spring.datasource.password=yourpassword
# ----------------------------------------------------------------------------
# PostgreSQL Configuration (Render Cloud DB)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----------------------------------------------------------------------------
# NEW: JWT (login tokens)
# CHANGE app.jwt.secret in production (32+ random characters).
# ----------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-before-going-to-production-32chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ----------------------------------------------------------------------------
# NEW: Outgoing email (OTP verification + welcome mail).
# Example for Gmail: create a 16-char "App Password" (not your normal
# password) at https://myaccount.google.com/apppasswords and set the two
# env vars below. Nothing crashes if left empty -- emails are just skipped
# and the OTP is logged to the console instead, so the app still runs.
# ----------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:no-reply@resumeai.local}
app.mail.enabled=${MAIL_ENABLED:false}

# ----------------------------------------------------------------------------
# NEW: Profile photo storage (served back at /uploads/**)
# ----------------------------------------------------------------------------
app.upload.dir=${UPLOAD_DIR:./uploads/profile-photos}
app.upload.public-path=/uploads/profile-photos
